services:
  - type: web
    name: finance-dashboard-api
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn finance_dashboard.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true       # Render auto-generates a secure key
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: finance-dashboard-db
          property: connectionString

databases:
  - name: Zorvyn-Finance-db
    databaseName: zorvyndb
    user: zorvynuser